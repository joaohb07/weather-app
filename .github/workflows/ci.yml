name: CI - Tests & Build

on:
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Unit & Integration Tests (Jest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install backend dependencies
        run: npm ci

      - name: Run Jest tests
        run: npm test

  frontend-tests:
    name: Frontend Build & Cypress Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install root & frontend dependencies
        run: |
          npm ci
          npm --prefix client ci

      - name: Build frontend bundle (Vite)
        run: npm --prefix client run build

      - name: Run Cypress Component Tests
        uses: cypress-io/github-action@v6
        with:
          working-directory: client
          install: false
          component: true

      - name: Run Cypress E2E Tests
        working-directory: ./client
        env:
          CYPRESS_baseUrl: 'http://127.0.0.1:3000'
        run: |
          npm start --prefix .. &
          npx wait-on http://127.0.0.1:3000 --timeout 30000
          npx cypress run --e2e